name: proof-lanes-shadow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-vs-installed:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare artifacts
        run: mkdir -p artifacts

      - name: SOURCE lane tests
        env:
          PYTHONPATH: src
        run: |
          /usr/bin/time -f '%e' -o artifacts/source-tests-seconds.txt \
            python -m unittest discover -s tests -v

      - name: SOURCE lane deterministic capture
        run: |
          python scripts/proof_lane_shadow.py capture \
            --mode source \
            --out artifacts/source.json

      - name: Install editable package
        run: |
          /usr/bin/time -f '%e' -o artifacts/install-seconds.txt \
            python -m pip install -e .

      - name: INSTALLED lane tests
        run: |
          /usr/bin/time -f '%e' -o artifacts/installed-tests-seconds.txt \
            python -m unittest discover -s tests -v

      - name: INSTALLED lane deterministic capture
        run: |
          python scripts/proof_lane_shadow.py capture \
            --mode installed \
            --out artifacts/installed.json

      - name: Packaging contract
        run: |
          python scripts/proof_lane_shadow.py packaging-check \
            --out artifacts/packaging.json

      - name: Differential gate
        run: |
          python scripts/proof_lane_shadow.py compare \
            --source artifacts/source.json \
            --installed artifacts/installed.json \
            --out artifacts/differential.json

      - name: Upload proof-lane shadow report
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-lanes-shadow-python-${{ matrix.python-version }}
          path: artifacts/
