name: install-subcost-shadow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  paired-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        order: ["default-first", "no-isolation-first"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run paired install subcost experiment
        run: |
          mkdir -p artifacts
          python scripts/install_subcost_shadow.py \
            --order "${{ matrix.order }}" \
            --out "artifacts/install-subcost-${{ matrix.python-version }}-${{ matrix.order }}.json"

      - name: Upload paired install report
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: install-subcost-python-${{ matrix.python-version }}-${{ matrix.order }}
          path: artifacts/
