name: factorized-ci-shadow

on:
  push:
    branches:
      - benchmark/factorized-ci-shadow-v0.3

permissions:
  contents: read

jobs:
  source:
    name: source (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Source unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Source declared CLI surface
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts
          python scripts/proof_lane_differential.py collect \
            --lane source \
            --output artifacts/source-lane.json

      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factorized-source-${{ matrix.python-version }}
          path: artifacts/

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Build wheel once
        run: |
          mkdir -p dist
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected exactly one wheel, found {len(wheels)}')
          print(wheels[0])
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factorized-wheel
          path: dist/*.whl

  installed-wheel:
    name: installed wheel (${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: factorized-wheel
          path: dist

      - name: Install built wheel
        run: python -m pip install --no-deps dist/*.whl

      - name: Installed unit tests
        run: python -m unittest discover -s tests -v

      - name: Installed declared CLI surface
        run: |
          mkdir -p artifacts
          python scripts/proof_lane_differential.py collect \
            --lane installed \
            --output artifacts/installed-lane.json

      - name: Package-data smoke
        run: |
          opus-eval code24 > artifacts/code24.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/code24.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not data:
              raise SystemExit('packaged code24 data is empty')
          print('packaged code24 data: OK')
          PY

      - name: Upload installed receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factorized-installed-${{ matrix.python-version }}
          path: artifacts/
