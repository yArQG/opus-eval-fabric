name: paired-install-shadow
on:
  push:
    branches: [benchmark/paired-timing-v0.4]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        block: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Four balanced pairs in fresh environments
        run: python scripts/paired_install_ci.py --pairs 4 --block ${{ matrix.block }} --output artifacts/paired.json
      - name: Preserve timing and proof receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paired-${{ matrix.python-version }}-${{ matrix.block }}
          path: artifacts/
