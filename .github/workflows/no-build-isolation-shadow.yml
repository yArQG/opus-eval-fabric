name: no-build-isolation-shadow

on:
  push:
    branches:
      - benchmark/factorized-ci-shadow-v0.3

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Observe build-tool versions
        run: |
          python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          for name in ('setuptools', 'wheel'):
              try:
                  print(f'{name}={version(name)}')
              except PackageNotFoundError:
                  raise SystemExit(f'missing declared build tool: {name}')
          PY

      - name: Install editable package without isolated build env
        run: python -m pip install --no-build-isolation -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test
        run: |
          opus-eval doctor
          opus-eval validate examples/mission.json
          opus-eval run examples/mission.json
          opus-eval plan examples/mission.json
          opus-eval command-center examples/mission.json
          opus-eval adapter-python --source src/opus_eval_fabric/evaluator.py

      - name: Deterministic regression benchmark
        run: |
          mkdir -p artifacts
          opus-eval benchmark benchmarks/suite.json \
            --json-out artifacts/benchmark.json \
            --junit-out artifacts/benchmark.xml

      - name: Dogfood incremental benchmark
        run: |
          opus-eval benchmark-incremental benchmarks/dogfood/pr3_ci_action_pinning.json \
            --json-out artifacts/dogfood-incremental.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: no-build-isolation-python-${{ matrix.python-version }}
          path: artifacts/
