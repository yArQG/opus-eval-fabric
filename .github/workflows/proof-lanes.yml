name: proof-lanes

on:
  push:
    branches:
      - benchmark/proof-lanes-v0.3

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Source lane unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Source lane receipt
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts
          python scripts/proof_lane_differential.py collect \
            --lane source \
            --output artifacts/source-lane.json

      - name: Installed lane setup
        run: python -m pip install -e .

      - name: Installed lane unit tests
        run: python -m unittest discover -s tests -v

      - name: Installed lane receipt
        run: |
          python scripts/proof_lane_differential.py collect \
            --lane installed \
            --output artifacts/installed-lane.json

      - name: Differential gate
        run: |
          python scripts/proof_lane_differential.py compare \
            --source artifacts/source-lane.json \
            --installed artifacts/installed-lane.json \
            --output artifacts/proof-lane-differential.json

      - name: Upload proof-lane receipts
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-lanes-python-${{ matrix.python-version }}
          path: artifacts/
