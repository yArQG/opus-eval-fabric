[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opus-eval-fabric"
version = "0.2.0rc1"
description = "Evidence-first evaluation and anti-malfunction harness for agentic workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
opus-eval = "opus_eval_fabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
